name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Authenticate against the GitHub Container Registry
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 3. Build and push the image using standard docker CLI
    - name: Build and Push the Docker image
      run: |
        # Convert repository name to lowercase to prevent GHCR naming errors
        IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        TAG_VERSION=$(date +%s)
        
        echo "Building and pushing $IMAGE_NAME:$TAG_VERSION..."
        
        # Build the image with the specific registry destination tag
        docker build . --file Dockerfile --tag $IMAGE_NAME:$TAG_VERSION --tag $IMAGE_NAME:latest
        
        # Push both the timestamped and latest tags to GHCR
        docker push $IMAGE_NAME:$TAG_VERSION
        docker push $IMAGE_NAME:latest
